# main 브랜치에 푸시될 때마다 Hugging Face Space로 미러 푸시해 자동 배포한다.
#
# 사전 준비 (1회):
# 1. https://huggingface.co/new-space 에서 Streamlit SDK로 Space 생성
# 2. https://huggingface.co/settings/tokens 에서 Write 권한 토큰 발급
# 3. GitHub 저장소 Settings → Secrets and variables → Actions 에
#    - HF_TOKEN: 위에서 발급한 토큰
#    - HF_SPACE: Space 경로 (예: zzazzu1103/gil-zabi)
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git push --force \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" \
            HEAD:main
